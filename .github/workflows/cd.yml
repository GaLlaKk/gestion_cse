name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tagged commit belongs to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME doit pointer sur un commit de main."
            exit 1
          fi

  test:
    name: Run tests
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            data_separator: ";"
          - platform: macos
            runner: macos-15-intel
            data_separator: ":"
          - platform: linux
            runner: ubuntu-24.04
            data_separator: ":"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Stamp version from tag
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME}\"" > services/version.py

      - name: Build desktop executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name GestionCSE
          --collect-all tkinterdnd2
          --exclude-module unittest
          --exclude-module pydoc
          --exclude-module doctest
          --exclude-module numpy
          --exclude-module pandas
          --exclude-module matplotlib
          --exclude-module PIL
          --exclude-module pytest
          --exclude-module setuptools
          --exclude-module pip
          --exclude-module test
          --exclude-module distutils
          --add-data
          "swile_active_directory/in/collaborators_template_090d2568-c182-4cf4-8b3a-81fefee3a297.csv${{ matrix.data_separator }}swile_active_directory/in"
          cse_desktop_app.py

      - name: Add runtime instructions (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          @'
          Gestion CSE ${{ github.ref_name }}
          Lancer GestionCSE.exe.

          Le modèle CSV Swile est embarqué dans l'exécutable.
          Le mapping des lieux et les filtres Swile sont configurables dans
          swile.config.json à côté de l'exécutable.
          Les règles sont parcourues dans l'ordre; tous les termes d'un motif
          doivent apparaître, et la première règle correspondante est utilisée.
          En l'absence de ce fichier, les paramètres actuels sont utilisés.
          Pour générer l'export Active Directory, placez
          liste_salarie_active_directory.config.json à côté de l'exécutable.
          Ce fichier de configuration n'est pas inclus dans l'artefact.

          Les fichiers d'entrée et de sortie restent à côté de l'exécutable,
          dans swile_active_directory\in et swile_active_directory\out.
          '@ | Set-Content dist\LIRE_AVANT_LANCEMENT.txt -Encoding utf8
          Copy-Item swile.config.json `
            dist\swile.config.json

      - name: Add runtime instructions (macOS and Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cat > dist/LIRE_AVANT_LANCEMENT.txt << 'EOF'
          Gestion CSE ${{ github.ref_name }}
          Lancer GestionCSE.

          Le modèle CSV Swile est embarqué dans l'exécutable.
          Le mapping des lieux et les filtres Swile sont configurables dans
          swile.config.json à côté de l'exécutable.
          Les règles sont parcourues dans l'ordre; tous les termes d'un motif
          doivent apparaître, et la première règle correspondante est utilisée.
          En l'absence de ce fichier, les paramètres actuels sont utilisés.
          Pour générer l'export Active Directory, placez
          liste_salarie_active_directory.config.json à côté de l'exécutable.
          Ce fichier de configuration n'est pas inclus dans l'artefact.

          Les fichiers d'entrée et de sortie restent à côté de l'exécutable,
          dans swile_active_directory/in et swile_active_directory/out.
          EOF
          cp swile.config.json \
            dist/swile.config.json

      - name: Package executable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive `
            -Path dist\GestionCSE.exe, dist\LIRE_AVANT_LANCEMENT.txt, `
              dist\swile.config.json `
            -DestinationPath artifacts\GestionCSE-${{ github.ref_name }}-windows-${{ runner.arch }}.zip `
            -Force

      - name: Package executable (macOS and Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          zip -j "artifacts/GestionCSE-${{ github.ref_name }}-${{ matrix.platform }}-${{ runner.arch }}.zip" \
            dist/GestionCSE dist/LIRE_AVANT_LANCEMENT.txt \
            dist/swile.config.json

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: GestionCSE-${{ matrix.platform }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: GestionCSE-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish packages on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::La release $RELEASE_TAG est déjà publiée (immuable) : impossible d'y ajouter les exécutables."
              echo "::error::Supprimez-la, puis poussez un nouveau tag (ne créez pas la release à la main)."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
              --draft \
              --title "Gestion CSE $RELEASE_TAG" \
              --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
