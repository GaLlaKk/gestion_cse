name: Start Copilot for approved issues

on:
  issues:
    types: [labeled]

permissions:
  issues: read
  contents: read

jobs:
  assign-copilot:
    if: github.event.label.name == 'copilot-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure the COPILOT_ASSIGNMENT_TOKEN repository secret."
            exit 1
          fi

          owner="${GH_REPO%%/*}"
          name="${GH_REPO#*/}"
          lookup=$(gh api graphql \
            -F query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                defaultBranchRef { name }
                issue(number: $number) {
                  assignees(first: 100) { nodes { login } }
                }
              }
            }' \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$ISSUE_NUMBER")

          if jq -e \
            '.data.repository.issue.assignees.nodes
              | any(.login == "copilot-swe-agent" or .login == "copilot-swe-agent[bot]")' \
            <<< "$lookup" >/dev/null; then
            echo "Copilot is already assigned to issue #$ISSUE_NUMBER."
            exit 0
          fi

          base_ref=$(jq -er '.data.repository.defaultBranchRef.name' <<< "$lookup")

          payload=$(jq -n \
            --arg repository "$GH_REPO" \
            --arg base_ref "$base_ref" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $repository,
                base_branch: $base_ref,
                custom_instructions: "",
                custom_agent: "",
                model: ""
              }
            }')

          result=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GH_REPO/issues/$ISSUE_NUMBER/assignees" \
            --input - <<< "$payload")

          if ! jq -e \
            '(.assignees // [])
              | any(.login == "copilot-swe-agent" or .login == "copilot-swe-agent[bot]")' \
            <<< "$result" >/dev/null; then
            echo "::error::The GitHub API did not confirm the Copilot assignment for issue #$ISSUE_NUMBER."
            jq -c '{message, assignees: [(.assignees // [])[].login]}' <<< "$result" >&2
            exit 1
          fi

          echo "Assigned Copilot to issue #$ISSUE_NUMBER."